<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --ink: #132126;
    --muted: #667580;
    --line: #d9e0e8;
    --sidebar: #102027;
    --accent: #0f766e;
    --accent-dark: #0d625c;
    --danger: #b42318;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: Arial, Helvetica, sans-serif;
  }

  .loading-overlay {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: rgba(246, 247, 249, 0.72);
  }

  .loading-overlay.is-hidden {
    display: none;
  }

  .loader {
    width: 54px;
    height: 54px;
    border: 6px solid #d9e0e8;
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  .loading-message {
    color: var(--muted);
    font-size: 13px;
    font-weight: 800;
    text-transform: uppercase;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .app-shell {
    display: grid;
    grid-template-columns: 236px 1fr;
    min-height: 100vh;
  }

  .sidebar {
    position: sticky;
    top: 0;
    height: 100vh;
    background: var(--sidebar);
    color: #fff;
    padding: 22px 18px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 28px;
  }

  .brand-mark {
    display: grid;
    place-items: center;
    width: 38px;
    height: 38px;
    border-radius: 8px;
    background: var(--accent);
    font-weight: 900;
  }

  .brand-text {
    font-weight: 900;
    letter-spacing: 0;
  }

  .nav {
    display: grid;
    gap: 8px;
  }

  .nav-link {
    display: block;
    padding: 11px 12px;
    border-radius: 6px;
    color: rgba(255, 255, 255, 0.78);
    font-weight: 800;
    text-decoration: none;
  }

  .nav-link:hover,
  .nav-link.active {
    background: rgba(255, 255, 255, 0.12);
    color: #fff;
  }

  .main {
    min-width: 0;
    padding: 30px;
  }

  .view {
    display: none;
  }

  .view.active {
    display: block;
  }

  .page-header {
    margin-bottom: 18px;
  }

  .page-header h1 {
    margin: 0;
    font-size: 28px;
    line-height: 1.18;
  }

  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: end;
    margin-bottom: 18px;
  }

  .filter-field {
    display: grid;
    gap: 5px;
  }

  .filter-field span {
    color: var(--muted);
    font-size: 12px;
    font-weight: 900;
  }

  input,
  select {
    min-width: 220px;
    min-height: 38px;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: #fff;
    color: var(--ink);
    font: inherit;
  }

  .button {
    min-height: 38px;
    padding: 8px 14px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: #fff;
    color: var(--ink);
    font-weight: 900;
    cursor: pointer;
  }

  .button:hover {
    border-color: var(--accent);
    color: var(--accent-dark);
  }

  .table-section {
    min-width: 0;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel);
    overflow: hidden;
  }

  .section-header {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    align-items: center;
    padding: 16px 18px;
    border-bottom: 1px solid var(--line);
  }

  .section-header h2 {
    margin: 0;
    font-size: 18px;
  }

  .count {
    color: var(--muted);
    font-size: 13px;
    font-weight: 800;
  }

  .error-box {
    margin: 14px 18px 0;
    padding: 10px 12px;
    border: 1px solid #f5c2c0;
    border-radius: 6px;
    background: #fff4f2;
    color: var(--danger);
    font-weight: 800;
  }

  .is-hidden {
    display: none !important;
  }

  .table-wrap {
    overflow: auto;
    max-height: calc(100vh - 238px);
  }

  table {
    border-collapse: separate;
    border-spacing: 0;
    width: 100%;
  }

  .teachers-table {
    min-width: 920px;
  }

  th,
  td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--line);
    text-align: left;
    vertical-align: middle;
    white-space: nowrap;
  }

  th {
    position: sticky;
    top: 0;
    z-index: 2;
    background: #edf2f7;
    color: #1f2d35;
    font-size: 12px;
    font-weight: 900;
  }

  tr.student-band-even td {
    background: #fff;
  }

  tr.student-band-odd td {
    background: #f8fafc;
  }

  .missing {
    color: var(--muted);
  }

  .empty {
    margin: 0;
    padding: 22px 18px;
    color: var(--muted);
    font-weight: 800;
  }

  .export-button {
    position: fixed;
    right: 26px;
    bottom: 26px;
    z-index: 20;
    display: grid;
    place-items: center;
    width: 62px;
    height: 62px;
    border: 0;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    box-shadow: 0 14px 30px rgba(15, 118, 110, 0.30);
    cursor: pointer;
  }

  .export-button:hover {
    background: var(--accent-dark);
  }

  .export-button:disabled {
    cursor: not-allowed;
    opacity: 0.55;
  }

  .export-button .bi {
    font-size: 32px;
    line-height: 1;
  }

  @media (max-width: 820px) {
    .app-shell {
      grid-template-columns: 1fr;
    }

    .sidebar {
      position: static;
      height: auto;
    }

    .main {
      padding: 20px;
    }

    .table-wrap {
      max-height: none;
    }

    input,
    select,
    .filter-field {
      width: 100%;
      min-width: 0;
    }
  }
</style>
