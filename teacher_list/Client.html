<script>
  const state = {
    rows: [],
    departments: [],
    visibleRows: [],
    classOptions: [],
    classTeacherRows: [],
    structureRows: [],
    visibleStructureRows: [],
    loading: false,
    activeView: 'llistat',
  };

  const elements = {
    loadingOverlay: document.getElementById('loading-overlay'),
    loadingMessage: document.getElementById('loading-message'),
    navLinks: document.querySelectorAll('.nav-link'),
    views: document.querySelectorAll('.view'),
    nameFilter: document.getElementById('name-filter'),
    departmentFilter: document.getElementById('department-filter'),
    resetFilters: document.getElementById('reset-filters'),
    teacherTable: document.getElementById('teacher-table'),
    teacherCount: document.getElementById('teacher-count'),
    teacherEmpty: document.getElementById('teacher-empty'),
    listError: document.getElementById('list-error'),
    exportButton: document.getElementById('export-xlsx'),
    classFilter: document.getElementById('class-filter'),
    classTeacherTable: document.getElementById('class-teacher-table'),
    classTeacherCount: document.getElementById('class-teacher-count'),
    classEmpty: document.getElementById('class-empty'),
    classError: document.getElementById('class-error'),
    structureFilter: document.getElementById('structure-filter'),
    resetStructureFilters: document.getElementById('reset-structure-filters'),
    structureTable: document.getElementById('structure-table'),
    structureCount: document.getElementById('structure-count'),
    structureEmpty: document.getElementById('structure-empty'),
    structureError: document.getElementById('structure-error'),
  };

  elements.navLinks.forEach((link) => {
    link.addEventListener('click', (event) => {
      event.preventDefault();
      showView(link.dataset.view);
    });
  });

  elements.nameFilter.addEventListener('input', renderTeacherList);
  elements.departmentFilter.addEventListener('change', renderTeacherList);
  elements.resetFilters.addEventListener('click', resetFilters);
  elements.exportButton.addEventListener('click', downloadCurrentViewXlsx);
  elements.classFilter.addEventListener('change', loadTeachersForSelectedClass);
  elements.structureFilter.addEventListener('input', renderStructureList);
  elements.resetStructureFilters.addEventListener('click', resetStructureFilters);

  loadTeacherList();
  loadClassOptions();
  loadStructureData();

  function loadTeacherList() {
    setLoading(true, 'Carregant professorat');
    clearError();

    google.script.run
      .withSuccessHandler((data) => {
        state.rows = data.rows || [];
        state.departments = data.departments || [];
        fillDepartmentFilter();
        renderTeacherList();
        setLoading(false);
      })
      .withFailureHandler((error) => {
        setLoading(false);
        showError(getErrorMessage(error));
      })
      .getTeacherListData();
  }

  function loadStructureData() {
    google.script.run
      .withSuccessHandler((data) => {
        state.structureRows = data.rows || [];
        renderStructureList();
      })
      .withFailureHandler((error) => {
        showStructureError(getErrorMessage(error));
      })
      .getStructureData();
  }

  function loadClassOptions() {
    google.script.run
      .withSuccessHandler((options) => {
        state.classOptions = options || [];
        fillClassFilter();
      })
      .withFailureHandler((error) => {
        showClassError(getErrorMessage(error));
      })
      .getClassOptions();
  }

  function showView(view) {
    state.activeView = view;
    elements.navLinks.forEach((link) => link.classList.toggle('active', link.dataset.view === view));
    elements.views.forEach((section) => section.classList.toggle('active', section.id === 'view-' + view));
    elements.exportButton.classList.toggle('is-hidden', !['llistat', 'per-classe', 'estructura'].includes(view));
  }

  function fillDepartmentFilter() {
    const currentValue = elements.departmentFilter.value;
    elements.departmentFilter.innerHTML = '<option value="">Tots</option>';

    state.departments.forEach((department) => {
      const option = document.createElement('option');
      option.value = department;
      option.textContent = department;
      elements.departmentFilter.appendChild(option);
    });

    elements.departmentFilter.value = state.departments.includes(currentValue) ? currentValue : '';
  }

  function fillClassFilter() {
    const currentValue = elements.classFilter.value;
    elements.classFilter.innerHTML = '<option value="">Selecciona una classe</option>';

    state.classOptions.forEach((label) => {
      const option = document.createElement('option');
      option.value = label;
      option.textContent = label;
      elements.classFilter.appendChild(option);
    });

    elements.classFilter.value = state.classOptions.includes(currentValue) ? currentValue : '';
  }

  function loadTeachersForSelectedClass() {
    const classLabel = elements.classFilter.value;
    state.classTeacherRows = [];
    drawClassTeacherRows([]);
    updateClassTeacherCount(0);
    clearClassError();

    if (!classLabel) {
      elements.classEmpty.textContent = 'Selecciona una classe.';
      elements.classEmpty.classList.remove('is-hidden');
      return;
    }

    setLoading(true, 'Carregant classe');
    google.script.run
      .withSuccessHandler((rows) => {
        state.classTeacherRows = rows || [];
        drawClassTeacherRows(state.classTeacherRows);
        updateClassTeacherCount(state.classTeacherRows.length);
        elements.classEmpty.textContent = 'No teachers found for this class.';
        elements.classEmpty.classList.toggle('is-hidden', state.classTeacherRows.length > 0);
        setLoading(false);
      })
      .withFailureHandler((error) => {
        setLoading(false);
        showClassError(getErrorMessage(error));
      })
      .getTeachersForClass(classLabel);
  }

  function renderTeacherList() {
    const filters = getFilters();
    const rows = state.rows.filter((row) => {
      if (filters.department && row.dept !== filters.department) return false;
      if (filters.search) {
        const haystack = normalize([row.nom, row.cognom1, row.cognom2].join(' '));
        if (!haystack.includes(filters.search)) return false;
      }
      return true;
    });

    state.visibleRows = rows;
    drawTeacherRows(rows);
    updateCount(rows.length);
    elements.teacherEmpty.classList.toggle('is-hidden', rows.length > 0);
  }

  function drawTeacherRows(rows) {
    elements.teacherTable.innerHTML = '';
    const fragment = document.createDocumentFragment();

    rows.forEach((row, index) => {
      const tr = document.createElement('tr');
      tr.className = index % 2 === 0 ? 'student-band-even' : 'student-band-odd';
      ['dept', 'nom', 'cognom1', 'cognom2', 'correuInstit'].forEach((key) => {
        const td = document.createElement('td');
        const value = row[key] || '';
        td.textContent = value || '—';
        if (!value) td.classList.add('missing');
        tr.appendChild(td);
      });
      fragment.appendChild(tr);
    });

    elements.teacherTable.appendChild(fragment);
  }

  function updateCount(count) {
    elements.teacherCount.textContent = count === 1 ? '1 professor' : count + ' professors';
  }

  function drawClassTeacherRows(rows) {
    elements.classTeacherTable.innerHTML = '';
    const fragment = document.createDocumentFragment();

    rows.forEach((row, index) => {
      const tr = document.createElement('tr');
      tr.className = index % 2 === 0 ? 'student-band-even' : 'student-band-odd';
      ['teacherName', 'subject', 'correuInstit'].forEach((key) => {
        const td = document.createElement('td');
        const value = row[key] || '';
        td.textContent = value || '—';
        if (!value) td.classList.add('missing');
        tr.appendChild(td);
      });
      fragment.appendChild(tr);
    });

    elements.classTeacherTable.appendChild(fragment);
  }

  function updateClassTeacherCount(count) {
    elements.classTeacherCount.textContent = count === 1 ? '1 resultat' : count + ' resultats';
  }

  function renderStructureList() {
    const filters = getStructureFilters();
    const rows = state.structureRows.filter((row) => {
      if (!filters.search) return true;
      return normalize([row.carrec, row.asignado].join(' ')).includes(filters.search);
    });

    state.visibleStructureRows = rows;
    drawStructureRows(rows);
    updateStructureCount(rows.length);
    elements.structureEmpty.classList.toggle('is-hidden', rows.length > 0);
  }

  function drawStructureRows(rows) {
    elements.structureTable.innerHTML = '';
    const fragment = document.createDocumentFragment();

    rows.forEach((row, index) => {
      const tr = document.createElement('tr');
      tr.className = index % 2 === 0 ? 'student-band-even' : 'student-band-odd';
      ['carrec', 'asignado'].forEach((key) => {
        const td = document.createElement('td');
        const value = row[key] || '';
        td.textContent = value || '—';
        if (!value) td.classList.add('missing');
        tr.appendChild(td);
      });
      fragment.appendChild(tr);
    });

    elements.structureTable.appendChild(fragment);
  }

  function updateStructureCount(count) {
    elements.structureCount.textContent = count === 1 ? '1 càrrec' : count + ' càrrecs';
  }

  function resetFilters() {
    elements.nameFilter.value = '';
    elements.departmentFilter.value = '';
    renderTeacherList();
  }

  function resetStructureFilters() {
    elements.structureFilter.value = '';
    renderStructureList();
  }

  function downloadCurrentViewXlsx() {
    if (state.activeView === 'per-classe') {
      downloadCurrentClassXlsx();
      return;
    }

    if (state.activeView === 'estructura') {
      downloadCurrentStructureXlsx();
      return;
    }

    downloadCurrentListXlsx();
  }

  function downloadCurrentListXlsx() {
    const filters = getRawFilters();
    setLoading(true, 'Exportant XLSX');
    clearError();
    elements.exportButton.disabled = true;

    google.script.run
      .withSuccessHandler((file) => {
        triggerFileDownload(file);
        elements.exportButton.disabled = false;
        setLoading(false);
      })
      .withFailureHandler((error) => {
        elements.exportButton.disabled = false;
        setLoading(false);
        showError(getErrorMessage(error));
      })
      .createTeacherListXlsx(filters);
  }

  function downloadCurrentClassXlsx() {
    const classLabel = elements.classFilter.value;
    if (!classLabel) {
      showClassError('Selecciona una classe abans d\'exportar.');
      return;
    }

    setLoading(true, 'Exportant XLSX');
    clearClassError();
    elements.exportButton.disabled = true;

    google.script.run
      .withSuccessHandler((file) => {
        triggerFileDownload(file);
        elements.exportButton.disabled = false;
        setLoading(false);
      })
      .withFailureHandler((error) => {
        elements.exportButton.disabled = false;
        setLoading(false);
        showClassError(getErrorMessage(error));
      })
      .createClassTeachersXlsx(classLabel);
  }

  function downloadCurrentStructureXlsx() {
    const filters = getRawStructureFilters();
    setLoading(true, 'Exportant XLSX');
    clearStructureError();
    elements.exportButton.disabled = true;

    google.script.run
      .withSuccessHandler((file) => {
        triggerFileDownload(file);
        elements.exportButton.disabled = false;
        setLoading(false);
      })
      .withFailureHandler((error) => {
        elements.exportButton.disabled = false;
        setLoading(false);
        showStructureError(getErrorMessage(error));
      })
      .createStructureXlsx(filters);
  }

  function triggerFileDownload(file) {
    const link = document.createElement('a');
    link.href = 'data:' + file.mimeType + ';base64,' + file.base64;
    link.download = file.fileName;
    document.body.appendChild(link);
    link.click();
    link.remove();
  }

  function getRawFilters() {
    return {
      search: elements.nameFilter.value.trim(),
      department: elements.departmentFilter.value,
    };
  }

  function getFilters() {
    const raw = getRawFilters();
    return {
      search: normalize(raw.search),
      department: raw.department,
    };
  }

  function getRawStructureFilters() {
    return {
      search: elements.structureFilter.value.trim(),
    };
  }

  function getStructureFilters() {
    const raw = getRawStructureFilters();
    return {
      search: normalize(raw.search),
    };
  }

  function setLoading(isLoading, message) {
    state.loading = isLoading;
    elements.loadingOverlay.classList.toggle('is-hidden', !isLoading);
    if (message) elements.loadingMessage.textContent = message;
  }

  function showError(message) {
    elements.listError.textContent = message;
    elements.listError.classList.remove('is-hidden');
  }

  function clearError() {
    elements.listError.textContent = '';
    elements.listError.classList.add('is-hidden');
  }

  function showClassError(message) {
    elements.classError.textContent = message;
    elements.classError.classList.remove('is-hidden');
  }

  function clearClassError() {
    elements.classError.textContent = '';
    elements.classError.classList.add('is-hidden');
  }

  function showStructureError(message) {
    elements.structureError.textContent = message;
    elements.structureError.classList.remove('is-hidden');
  }

  function clearStructureError() {
    elements.structureError.textContent = '';
    elements.structureError.classList.add('is-hidden');
  }

  function getErrorMessage(error) {
    if (!error) return 'Error desconegut.';
    return error.message || String(error);
  }

  function normalize(value) {
    return String(value || '')
      .normalize('NFD')
      .replace(/[̀-ͯ]/g, '')
      .toLocaleLowerCase('ca');
  }
</script>
