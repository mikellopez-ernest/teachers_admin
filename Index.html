<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" rel="stylesheet">
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f8fa;
        --surface: #ffffff;
        --line: #d8dde6;
        --line-strong: #aab4c3;
        --text: #1f2937;
        --muted: #667085;
        --accent: #2563eb;
        --accent-dark: #1d4ed8;
        --danger: #b42318;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
        font-size: 14px;
        padding-bottom: 82px;
      }

      .app {
        width: min(1500px, calc(100vw - 24px));
        min-height: calc(100vh - 82px);
      }

      h1 {
        margin: 0 0 18px;
        font-size: 22px;
        font-weight: 700;
      }

      label {
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0;
      }

      .status-matrix {
        display: grid;
        grid-template-columns: repeat(3, minmax(120px, 1fr));
        gap: 8px 18px;
        max-width: 620px;
      }

      .status-matrix .form-check {
        margin: 0;
      }

      tbody input {
        width: 16px;
        height: 16px;
      }

      button:not(.btn) {
        height: 36px;
        border: 1px solid var(--line-strong);
        border-radius: 6px;
        background: var(--surface);
        color: var(--text);
        padding: 0 14px;
        font-weight: 700;
        cursor: pointer;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.65;
      }

      a {
        color: var(--accent);
        font-weight: 700;
      }

      .message {
        min-height: 22px;
        margin: 8px 0;
        color: var(--muted);
      }

      .message.error {
        color: var(--danger);
      }

      .table-wrap {
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        max-height: calc(100vh - 300px);
      }

      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 1050px;
      }

      th,
      td {
        border-bottom: 1px solid var(--line);
        padding: 9px 10px;
        text-align: left;
        vertical-align: middle;
        white-space: nowrap;
      }

      th {
        position: sticky;
        top: 0;
        z-index: 1;
        background: #eef2f7;
        color: #344054;
        font-size: 12px;
        font-weight: 800;
      }

      th.sortable {
        cursor: pointer;
        user-select: none;
      }

      .name-link {
        height: auto;
        border: 0;
        background: transparent;
        color: var(--accent);
        padding: 0;
        font: inherit;
        font-weight: 700;
        text-align: left;
        text-decoration: underline;
        cursor: pointer;
      }

      th.select-col,
      td.select-col {
        width: 44px;
        text-align: center;
      }

      tbody tr:hover {
        background: #f5f8ff;
      }

      tbody tr.row-substitute > * {
        --bs-table-bg: #eef9f0;
        background-color: #eef9f0;
      }

      tbody tr.row-leave > * {
        --bs-table-bg: #fff1f1;
        background-color: #fff1f1;
      }

      tbody tr.row-substitute:hover > * {
        --bs-table-bg: #e1f4e6;
        background-color: #e1f4e6;
      }

      tbody tr.row-leave:hover > * {
        --bs-table-bg: #ffe3e3;
        background-color: #ffe3e3;
      }

      .actions {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 5;
        display: flex;
        gap: 10px;
        align-items: center;
        margin: 0;
        padding: 12px max(12px, calc((100vw - min(1500px, calc(100vw - 24px))) / 2));
        border-top: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.96);
        box-shadow: 0 -8px 24px rgba(15, 23, 42, 0.08);
      }

      .count {
        margin-left: auto;
        color: var(--muted);
      }

      .app-modal-backdrop {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(15, 23, 42, 0.38);
        padding: 18px;
      }

      .app-modal-backdrop.open {
        display: flex;
      }

      .app-modal-panel {
        width: min(980px, 100%);
        max-height: min(760px, calc(100vh - 36px));
        overflow: auto;
        border-radius: 8px;
        background: var(--surface);
        box-shadow: 0 24px 80px rgba(15, 23, 42, 0.25);
      }

      .app-modal-head,
      .app-modal-actions {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 16px 18px;
        border-bottom: 1px solid var(--line);
      }

      .app-modal-actions {
        justify-content: flex-end;
        border-top: 1px solid var(--line);
        border-bottom: 0;
      }

      .app-modal-title {
        margin: 0;
        font-size: 18px;
        flex: 1;
      }

      .app-modal-body {
        padding: 18px;
      }

      .detail-block {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 14px;
        margin-bottom: 14px;
        background: #ffffff;
      }

      .detail-item {
        border-bottom: 1px solid var(--line);
        padding-bottom: 8px;
        margin-bottom: 10px;
      }

      .detail-item:last-child {
        margin-bottom: 0;
      }

      .detail-label {
        color: var(--muted);
        display: block;
        font-size: 12px;
        font-weight: 700;
        margin-bottom: 4px;
      }

      .detail-value {
        min-height: 18px;
      }

      .form-field {
        display: grid;
        gap: 5px;
        margin-bottom: 10px;
      }

      .export-option {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 700;
      }

      .leave-form-grid {
        display: grid;
        gap: 14px;
      }

      .readonly-check {
        opacity: 0.8;
      }

      @media (max-width: 720px) {
        .app {
          width: calc(100vw - 20px);
          margin: 14px auto;
        }

        input[type='text'],
        select {
          min-width: 100%;
        }


        .actions {
          flex-wrap: wrap;
        }

        .count {
          width: 100%;
          margin-left: 0;
        }

      }
    </style>
  </head>
  <body>
    <main class="app container-fluid py-3 py-md-4 d-flex flex-column">
      <h1>Dades de professors</h1>

      <section class="row g-3 align-items-end mb-3" aria-label="Filtres">
        <div class="col-12 col-md-4 col-xl-2">
          <label class="form-label" for="deptFilter">DEPT.</label>
          <select id="deptFilter" class="form-select">
            <option value="">Tots</option>
          </select>
        </div>

        <div class="col-12 col-md-5 col-xl-3">
          <label class="form-label" for="nameFilter">NOM SENCER</label>
          <input id="nameFilter" class="form-control" type="text" autocomplete="off">
        </div>

        <div class="col-12 col-md-auto">
          <button id="resetButton" class="btn btn-outline-secondary w-100" type="button">RESET</button>
        </div>

        <div class="col-12 col-xl-5">
          <label class="form-label d-block">Estat</label>
          <div class="status-matrix" aria-label="Estat">
            <label class="form-check">
              <input id="activeFilter" class="form-check-input" type="checkbox" checked>
              <span class="form-check-label">Actius</span>
            </label>
            <label class="form-check">
              <input id="inactiveFilter" class="form-check-input" type="checkbox">
              <span class="form-check-label">No actius</span>
            </label>
            <label class="form-check">
              <input id="newOnlyFilter" class="form-check-input" type="checkbox">
              <span class="form-check-label">Només nous</span>
            </label>
            <label class="form-check">
              <input id="noBaixaFilter" class="form-check-input" type="checkbox" checked>
              <span class="form-check-label">No baixa</span>
            </label>
            <label class="form-check">
              <input id="baixaFilter" class="form-check-input" type="checkbox">
              <span class="form-check-label">Baixa</span>
            </label>
          </div>
        </div>
      </section>

      <div id="message" class="message">Carregant dades...</div>

      <section class="table-wrap table-responsive flex-grow-1">
        <table class="table table-hover align-middle mb-0">
          <thead>
            <tr>
              <th class="select-col">
                <input id="selectVisibleRows" type="checkbox" aria-label="Seleccionar files filtrades">
              </th>
              <th class="sortable" data-sort="esp">ESP</th>
              <th class="sortable" data-sort="dept">DEPT.</th>
              <th class="sortable" data-sort="fullName">NOM SENCER</th>
              <th class="sortable" data-sort="situacio">SITUACIO</th>
              <th class="sortable" data-sort="jornada">JORNADA</th>
              <th class="sortable" data-sort="dni">DNI</th>
              <th class="sortable" data-sort="telf">TELF</th>
              <th class="sortable" data-sort="correu">CORREU</th>
              <th class="sortable" data-sort="xtec">XTEC</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </section>

      <section class="actions d-flex flex-wrap gap-2 align-items-center">
        <button id="baixaButton" class="btn btn-primary" type="button">Donar de baixa</button>
        <button id="actiuButton" class="btn btn-primary" type="button">Desactivar</button>
        <button id="exportButton" class="btn btn-outline-primary" type="button">Exportar</button>
        <span id="count" class="count ms-md-auto"></span>
      </section>
    </main>

    <div id="teacherModalBackdrop" class="app-modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="teacherModalTitle">
      <section class="app-modal-panel">
        <header class="app-modal-head">
          <h2 id="teacherModalTitle" class="app-modal-title">Professor</h2>
          <button id="closeTeacherModalButton" class="btn btn-outline-secondary" type="button">Tancar</button>
        </header>
        <div id="teacherModalBody" class="app-modal-body"></div>
        <footer id="teacherModalActions" class="app-modal-actions"></footer>
      </section>
    </div>

    <div id="exportModalBackdrop" class="app-modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="exportModalTitle">
      <section class="app-modal-panel">
        <header class="app-modal-head">
          <h2 id="exportModalTitle" class="app-modal-title">Exportar</h2>
          <button id="closeExportModalButton" class="btn btn-outline-secondary" type="button">Tancar</button>
        </header>
        <div class="app-modal-body">
          <label class="export-option">
            <input type="radio" name="exportFormat" value="csv" checked>
            Full de càlcul
          </label>
          <div id="exportResult" class="message"></div>
        </div>
        <footer class="app-modal-actions">
          <button id="cancelExportButton" class="btn btn-outline-secondary" type="button">Cancel·lar</button>
          <button id="confirmExportButton" class="btn btn-primary" type="button">Exportar</button>
        </footer>
      </section>
    </div>

    <div id="leaveModalBackdrop" class="app-modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="leaveModalTitle">
      <section class="app-modal-panel">
        <header class="app-modal-head">
          <h2 id="leaveModalTitle" class="app-modal-title">Baixa</h2>
          <button id="closeLeaveModalButton" class="btn btn-outline-secondary" type="button">Tancar</button>
        </header>
        <div id="leaveModalBody" class="app-modal-body"></div>
        <footer id="leaveModalActions" class="app-modal-actions"></footer>
      </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/es.js"></script>
    <script>
      const SITUACIO_OPTIONS = [
        'FUNC. DEF',
        'FUNC. PERFIL',
        'FUNC. SNS PLAÇA',
        'INT',
        'INT. PERF',
        'LABORAL',
      ];
      const JORNADA_OPTIONS = [
        'SENCERA',
        'MITJA',
        'REDUCCIÓ UN TERÇ',
      ];

      const state = {
        rows: [],
        departments: [],
        substitutes: [],
        visibleRows: [],
        selectedRows: new Set(),
        sortKey: '',
        sortDirection: 'asc',
        loading: false,
        leaveDatepicker: null,
      };

      const elements = {
        deptFilter: document.getElementById('deptFilter'),
        nameFilter: document.getElementById('nameFilter'),
        activeFilter: document.getElementById('activeFilter'),
        inactiveFilter: document.getElementById('inactiveFilter'),
        noBaixaFilter: document.getElementById('noBaixaFilter'),
        baixaFilter: document.getElementById('baixaFilter'),
        newOnlyFilter: document.getElementById('newOnlyFilter'),
        selectVisibleRows: document.getElementById('selectVisibleRows'),
        resetButton: document.getElementById('resetButton'),
        baixaButton: document.getElementById('baixaButton'),
        actiuButton: document.getElementById('actiuButton'),
        exportButton: document.getElementById('exportButton'),
        tableBody: document.getElementById('tableBody'),
        message: document.getElementById('message'),
        count: document.getElementById('count'),
        sortableHeaders: document.querySelectorAll('th.sortable'),
        teacherModalBackdrop: document.getElementById('teacherModalBackdrop'),
        teacherModalTitle: document.getElementById('teacherModalTitle'),
        teacherModalBody: document.getElementById('teacherModalBody'),
        teacherModalActions: document.getElementById('teacherModalActions'),
        closeTeacherModalButton: document.getElementById('closeTeacherModalButton'),
        exportModalBackdrop: document.getElementById('exportModalBackdrop'),
        exportResult: document.getElementById('exportResult'),
        closeExportModalButton: document.getElementById('closeExportModalButton'),
        cancelExportButton: document.getElementById('cancelExportButton'),
        confirmExportButton: document.getElementById('confirmExportButton'),
        leaveModalBackdrop: document.getElementById('leaveModalBackdrop'),
        leaveModalTitle: document.getElementById('leaveModalTitle'),
        leaveModalBody: document.getElementById('leaveModalBody'),
        leaveModalActions: document.getElementById('leaveModalActions'),
        closeLeaveModalButton: document.getElementById('closeLeaveModalButton'),
      };

      elements.deptFilter.addEventListener('change', render);
      elements.nameFilter.addEventListener('input', render);
      [
        elements.activeFilter,
        elements.inactiveFilter,
        elements.noBaixaFilter,
        elements.baixaFilter,
        elements.newOnlyFilter,
      ].forEach((checkbox) => {
        checkbox.addEventListener('change', () => {
          updateActionButtonState();
          render();
        });
      });
      elements.resetButton.addEventListener('click', resetFilters);
      elements.baixaButton.addEventListener('click', updateBaixa);
      elements.actiuButton.addEventListener('click', updateActiu);
      elements.exportButton.addEventListener('click', openExportModal);
      elements.selectVisibleRows.addEventListener('change', toggleVisibleSelection);
      elements.closeTeacherModalButton.addEventListener('click', closeTeacherModal);
      elements.closeExportModalButton.addEventListener('click', closeExportModal);
      elements.cancelExportButton.addEventListener('click', closeExportModal);
      elements.confirmExportButton.addEventListener('click', exportSelectedRows);
      elements.closeLeaveModalButton.addEventListener('click', closeLeaveModal);

      elements.sortableHeaders.forEach((header) => {
        header.addEventListener('click', () => {
          const key = header.dataset.sort;
          if (state.sortKey === key) {
            state.sortDirection = state.sortDirection === 'asc' ? 'desc' : 'asc';
          } else {
            state.sortKey = key;
            state.sortDirection = 'asc';
          }
          render();
        });
      });

      loadData();

      function loadData() {
        setLoading(true, 'Carregant dades...');

        google.script.run
          .withSuccessHandler((data) => {
            state.rows = data.rows || [];
            state.departments = data.departments || [];
            state.substitutes = data.substitutes || [];
            state.selectedRows.clear();
            fillDepartmentFilter();
            setLoading(false, '');
            updateActionButtonState();
            render();
          })
          .withFailureHandler((error) => {
            setLoading(false, '');
            showMessage(getErrorMessage(error), true);
          })
          .getProfessorsData();
      }

      function fillDepartmentFilter() {
        const currentValue = elements.deptFilter.value;
        elements.deptFilter.innerHTML = '<option value="">Tots</option>';

        state.departments.forEach((department) => {
          const option = document.createElement('option');
          option.value = department;
          option.textContent = department;
          elements.deptFilter.appendChild(option);
        });

        elements.deptFilter.value = state.departments.includes(currentValue)
          ? currentValue
          : '';
      }

      function render() {
        const department = elements.deptFilter.value;
        const search = normalize(elements.nameFilter.value);
        const showActive = elements.activeFilter.checked;
        const showInactive = elements.inactiveFilter.checked;
        const showNoBaixa = elements.noBaixaFilter.checked;
        const showBaixa = elements.baixaFilter.checked;
        const showOnlyNew = elements.newOnlyFilter.checked;

        let rows = state.rows.filter((row) => {
          if (department && row.dept !== department) return false;
          if (search && !normalize(row.fullName).includes(search)) return false;
          if (row.active && !showActive) return false;
          if (!row.active && !showInactive) return false;
          if (!row.baixa && !showNoBaixa) return false;
          if (row.baixa && !showBaixa) return false;
          if (showOnlyNew && !row.nou) return false;
          return true;
        });

        if (state.sortKey) {
          rows = [...rows].sort((a, b) => compareRows(a, b, state.sortKey));
          if (state.sortDirection === 'desc') rows.reverse();
        }

        state.visibleRows = rows;
        syncSelectedRowsWithVisibleRows();
        drawTable(rows);
        updateSortHeaders();
        updateCount();
      }

      function drawTable(rows) {
        elements.tableBody.innerHTML = '';

        const fragment = document.createDocumentFragment();

        rows.forEach((row) => {
          const tr = document.createElement('tr');
          if (row.baixa) {
            tr.classList.add('row-leave');
          } else if (row.subst) {
            tr.classList.add('row-substitute');
          }
          const checkboxCell = document.createElement('td');
          checkboxCell.className = 'select-col';

          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.checked = state.selectedRows.has(row.rowNumber);
          checkbox.addEventListener('change', () => {
            if (checkbox.checked) {
              state.selectedRows.add(row.rowNumber);
            } else {
              state.selectedRows.delete(row.rowNumber);
            }
            updateCount();
          });

          checkboxCell.appendChild(checkbox);
          tr.appendChild(checkboxCell);

          ['esp', 'dept', 'fullName', 'situacio', 'jornada', 'dni', 'telf', 'correu', 'xtec']
            .forEach((key) => {
              const td = document.createElement('td');
              if (key === 'fullName') {
                const link = document.createElement('a');
                link.href = '#';
                link.className = 'name-link';
                link.textContent = row[key] || '';
                link.addEventListener('click', (event) => {
                  event.preventDefault();
                  openTeacherModal(row.rowNumber);
                });
                td.appendChild(link);
              } else {
                td.textContent = row[key] || '';
              }
              tr.appendChild(td);
            });

          fragment.appendChild(tr);
        });

        elements.tableBody.appendChild(fragment);

        if (rows.length === 0) {
          showMessage('No hi ha files per mostrar.', false);
        } else {
          showMessage('', false);
        }
      }

      function updateSortHeaders() {
        elements.sortableHeaders.forEach((header) => {
          const label = header.textContent.replace(/\s+[AZ]-[ZA]$/, '');
          if (header.dataset.sort === state.sortKey) {
            header.textContent = `${label} ${state.sortDirection === 'asc' ? 'A-Z' : 'Z-A'}`;
          } else {
            header.textContent = label;
          }
        });
      }

      function updateCount() {
        elements.count.textContent =
          `${state.visibleRows.length} files | ${state.selectedRows.size} seleccionades`;
        updateSelectVisibleRowsState();
        updateActionButtonState();
      }

      function updateActionButtonState() {
        const selectedRows = getSelectedRowObjects();
        const selectedTeacher = selectedRows.length === 1 ? selectedRows[0] : null;
        const onlyInactive = elements.inactiveFilter.checked && !elements.activeFilter.checked;
        elements.baixaButton.textContent = selectedTeacher && selectedTeacher.baixa
          ? "Donar d'alta"
          : 'Donar de baixa';
        elements.baixaButton.disabled = state.loading || state.selectedRows.size === 0;
        elements.actiuButton.textContent = onlyInactive ? 'Activar' : 'Desactivar';
        elements.actiuButton.disabled = state.loading;
        elements.resetButton.disabled = state.loading;
        elements.exportButton.disabled = state.loading;
      }

      function getSelectedRowObjects() {
        const byRowNumber = new Map(state.rows.map((row) => [row.rowNumber, row]));
        return [...state.selectedRows]
          .map((rowNumber) => byRowNumber.get(rowNumber))
          .filter(Boolean);
      }

      function resetFilters() {
        elements.deptFilter.value = '';
        elements.nameFilter.value = '';
        render();
      }

      function updateBaixa() {
        const selectedRows = getSelectedRowObjects();

        if (selectedRows.length === 0) {
          showMessage('Cal seleccionar un professor.', true);
          return;
        }

        if (selectedRows.length > 1) {
          showMessage('Cal seleccionar nomes un professor per gestionar la baixa.', true);
          return;
        }

        if (selectedRows[0].baixa) {
          openReturnLeaveModal(selectedRows[0]);
        } else {
          openStartLeaveModal(selectedRows[0]);
        }
      }

      function updateActiu() {
        const value = elements.inactiveFilter.checked && !elements.activeFilter.checked;
        runUpdate('updateActiu', value, 'Actualitzant estat...');
      }

      function runUpdate(functionName, value, loadingMessage) {
        const rowNumbers = [...state.selectedRows];

        if (rowNumbers.length === 0) {
          showMessage('Cal seleccionar almenys una fila.', true);
          return;
        }

        setLoading(true, loadingMessage);

        google.script.run
          .withSuccessHandler(() => {
            loadData();
          })
          .withFailureHandler((error) => {
            setLoading(false, '');
            showMessage(getErrorMessage(error), true);
          })[functionName](rowNumbers, value);
      }

      function toggleVisibleSelection() {
        const visibleRowNumbers = state.visibleRows.map((row) => row.rowNumber);
        if (elements.selectVisibleRows.checked) {
          visibleRowNumbers.forEach((rowNumber) => state.selectedRows.add(rowNumber));
        } else {
          visibleRowNumbers.forEach((rowNumber) => state.selectedRows.delete(rowNumber));
        }
        render();
      }

      function syncSelectedRowsWithVisibleRows() {
        const allRowNumbers = new Set(state.rows.map((row) => row.rowNumber));
        [...state.selectedRows].forEach((rowNumber) => {
          if (!allRowNumbers.has(rowNumber)) state.selectedRows.delete(rowNumber);
        });
      }

      function updateSelectVisibleRowsState() {
        const visibleRowNumbers = state.visibleRows.map((row) => row.rowNumber);
        const selectedVisibleRows = visibleRowNumbers.filter((rowNumber) =>
          state.selectedRows.has(rowNumber)
        );
        elements.selectVisibleRows.checked =
          visibleRowNumbers.length > 0 && selectedVisibleRows.length === visibleRowNumbers.length;
        elements.selectVisibleRows.indeterminate =
          selectedVisibleRows.length > 0 && selectedVisibleRows.length < visibleRowNumbers.length;
      }

      function openTeacherModal(rowNumber) {
        elements.teacherModalBackdrop.classList.add('open');
        elements.teacherModalTitle.textContent = 'Professor';
        elements.teacherModalBody.textContent = 'Carregant...';
        elements.teacherModalActions.innerHTML = '';

        google.script.run
          .withSuccessHandler((teacher) => {
            renderTeacherDetails(teacher);
          })
          .withFailureHandler((error) => {
            elements.teacherModalBody.textContent = getErrorMessage(error);
          })
          .getTeacherDetails(rowNumber);
      }

      function closeTeacherModal() {
        elements.teacherModalBackdrop.classList.remove('open');
        elements.teacherModalBody.innerHTML = '';
        elements.teacherModalActions.innerHTML = '';
      }

      function renderTeacherDetails(teacher) {
        elements.teacherModalTitle.textContent = teacher.title || 'Professor';
        elements.teacherModalBody.innerHTML = '';
        elements.teacherModalActions.innerHTML = '';

        const fields = teacherFieldsToMap(teacher);
        const container = document.createElement('div');
        container.append(
          createTeacherDetailBlock([
            ['NOM', fields.nom],
            ['COGNOM1', fields.cognom1],
            ['COGNOM2', fields.cognom2],
          ], [
            ['ESP', fields.esp],
            ['REDUIT', fields.reduit],
            ['DEP', fields.dept],
            ['SITUACIO', fields.situacio],
            ['JORNADA', fields.jornada],
          ]),
          createTeacherDetailBlock([
            ['DNI', fields.dni],
            ['TELF', fields.telf],
            ['CORREU', fields.correu],
            ['XTEC', fields.xtec],
          ], [
            ['ACTIU', fields.actiu, 'boolean'],
            ['BAIXA', fields.baixa, 'boolean'],
            ['NOUS', fields.nous, 'boolean'],
            ['SUBST?', fields.subst, 'boolean'],
          ])
        );

        const editButton = document.createElement('button');
        editButton.type = 'button';
        editButton.className = 'btn btn-primary';
        editButton.textContent = 'Edit';
        editButton.addEventListener('click', () => renderTeacherForm(teacher));

        elements.teacherModalBody.appendChild(container);
        elements.teacherModalActions.appendChild(editButton);
      }

      function renderTeacherForm(teacher) {
        elements.teacherModalBody.innerHTML = '';
        elements.teacherModalActions.innerHTML = '';

        const fields = teacherFieldsToMap(teacher);
        const form = document.createElement('form');
        form.dataset.rowNumber = teacher.rowNumber;
        form.append(
          createTeacherFormBlock([
            ['NOM', 'nom', fields.nom],
            ['COGNOM1', 'cognom1', fields.cognom1],
            ['COGNOM2', 'cognom2', fields.cognom2],
          ], [
            ['ESP', 'esp', fields.esp],
            ['REDUIT', 'reduit', fields.reduit],
            ['DEP', 'dept', fields.dept],
            ['SITUACIO', 'situacio', fields.situacio, 'select', SITUACIO_OPTIONS],
            ['JORNADA', 'jornada', fields.jornada, 'select', JORNADA_OPTIONS],
          ]),
          createTeacherFormBlock([
            ['DNI', 'dni', fields.dni],
            ['TELF', 'telf', fields.telf],
            ['CORREU', 'correu', fields.correu],
            ['XTEC', 'xtec', fields.xtec],
          ], [
            ['ACTIU', 'actiu', fields.actiu, 'boolean'],
            ['BAIXA', 'baixa', fields.baixa, 'boolean-readonly'],
            ['NOUS', 'nous', fields.nous, 'boolean'],
            ['SUBST?', 'subst', fields.subst, 'boolean'],
          ])
        );

        const saveButton = document.createElement('button');
        saveButton.type = 'button';
        saveButton.className = 'btn btn-primary';
        saveButton.textContent = 'Save';
        saveButton.addEventListener('click', () => saveTeacherForm(form));

        const cancelButton = document.createElement('button');
        cancelButton.type = 'button';
        cancelButton.className = 'btn btn-outline-secondary';
        cancelButton.textContent = 'Cancel';
        cancelButton.addEventListener('click', () => renderTeacherDetails(teacher));

        elements.teacherModalBody.appendChild(form);
        elements.teacherModalActions.append(cancelButton, saveButton);
      }

      function teacherFieldsToMap(teacher) {
        return Object.fromEntries(teacher.fields.map((field) => [field.key, field.value]));
      }

      function createTeacherDetailBlock(leftItems, rightItems) {
        const block = document.createElement('section');
        block.className = 'detail-block';
        const row = document.createElement('div');
        row.className = 'row g-3';
        row.append(createDetailColumn(leftItems), createDetailColumn(rightItems));
        block.appendChild(row);
        return block;
      }

      function createDetailColumn(items) {
        const column = document.createElement('div');
        column.className = 'col-12 col-md-6';
        items.forEach(([labelText, value, type]) => {
          const item = document.createElement('div');
          item.className = 'detail-item';
          const label = document.createElement('span');
          label.className = 'detail-label';
          label.textContent = labelText;
          const displayValue = document.createElement('div');
          displayValue.className = 'detail-value';
          displayValue.textContent = type === 'boolean' ? (value ? 'TRUE' : 'FALSE') : (value || '');
          item.append(label, displayValue);
          column.appendChild(item);
        });
        return column;
      }

      function createTeacherFormBlock(leftItems, rightItems) {
        const block = document.createElement('section');
        block.className = 'detail-block';
        const row = document.createElement('div');
        row.className = 'row g-3';
        row.append(createFormColumn(leftItems), createFormColumn(rightItems));
        block.appendChild(row);
        return block;
      }

      function createFormColumn(items) {
        const column = document.createElement('div');
        column.className = 'col-12 col-md-6';
        items.forEach(([labelText, key, value, type, options]) => {
          const isBoolean = type === 'boolean' || type === 'boolean-readonly';
          const wrapper = document.createElement('label');
          wrapper.className = isBoolean ? 'form-check mb-2' : 'form-field';
          const input = document.createElement('input');
          input.name = key;
          input.dataset.type = isBoolean ? 'boolean' : 'text';

          if (isBoolean) {
            input.type = 'checkbox';
            input.className = 'form-check-input';
            input.checked = value === true;
            input.disabled = type === 'boolean-readonly';
            if (input.disabled) {
              input.dataset.readonly = 'true';
              wrapper.classList.add('readonly-check');
            }
            const label = document.createElement('span');
            label.className = 'form-check-label';
            label.textContent = labelText;
            wrapper.append(input, label);
          } else if (type === 'select') {
            const label = document.createElement('span');
            label.className = 'detail-label';
            label.textContent = labelText;
            const select = document.createElement('select');
            select.name = key;
            select.dataset.type = 'text';
            select.className = 'form-select';
            const emptyOption = document.createElement('option');
            emptyOption.value = '';
            emptyOption.textContent = '';
            select.appendChild(emptyOption);
            (options || []).forEach((optionValue) => {
              const option = document.createElement('option');
              option.value = optionValue;
              option.textContent = optionValue;
              select.appendChild(option);
            });
            select.value = value || '';
            wrapper.append(label, select);
          } else {
            const label = document.createElement('span');
            label.className = 'detail-label';
            label.textContent = labelText;
            input.type = 'text';
            input.className = 'form-control';
            input.value = value || '';
            wrapper.append(label, input);
          }

          column.appendChild(wrapper);
        });
        return column;
      }

      function saveTeacherForm(form) {
        const fields = {};
        form.querySelectorAll('input, select').forEach((input) => {
          if (input.dataset.readonly === 'true') return;
          fields[input.name] = input.dataset.type === 'boolean' ? input.checked : input.value;
        });
        elements.teacherModalActions.querySelectorAll('button').forEach((button) => {
          button.disabled = true;
        });

        google.script.run
          .withSuccessHandler((teacher) => {
            renderTeacherDetails(teacher);
            loadData();
          })
          .withFailureHandler((error) => {
            elements.teacherModalBody.insertAdjacentText('afterbegin', getErrorMessage(error));
            elements.teacherModalActions.querySelectorAll('button').forEach((button) => {
              button.disabled = false;
            });
          })
          .saveTeacherDetails(Number(form.dataset.rowNumber), fields);
      }

      function openStartLeaveModal(row) {
        elements.leaveModalTitle.textContent = 'Donar de baixa';
        elements.leaveModalBody.innerHTML = '';
        elements.leaveModalActions.innerHTML = '';
        elements.leaveModalBackdrop.classList.add('open');

        const form = document.createElement('form');
        form.className = 'leave-form-grid';
        form.innerHTML = `
          <div>
            <label class="form-label" for="leaveDate">Data d'inici</label>
            <input id="leaveDate" class="form-control" type="text" autocomplete="off">
          </div>
          <div>
            <label class="form-label" for="leaveSubstitute">Substitut</label>
            <select id="leaveSubstitute" class="form-select">
              <option value="">Selecciona substitut</option>
            </select>
          </div>
          <div>
            <label class="form-label" for="leaveComments">Comentaris</label>
            <textarea id="leaveComments" class="form-control" rows="4"></textarea>
          </div>
        `;

        elements.leaveModalBody.appendChild(form);
        const substituteSelect = form.querySelector('#leaveSubstitute');
        state.substitutes.forEach((substitute) => {
          if (substitute.esp === row.esp || substitute.code === row.reduit) return;
          const option = document.createElement('option');
          option.value = substitute.code;
          option.textContent = substitute.name;
          substituteSelect.appendChild(option);
        });

        const cancelButton = createModalButton('Cancel·lar', 'btn btn-outline-secondary', closeLeaveModal);
        const okButton = createModalButton('Ok', 'btn btn-primary', () => {
          const date = form.querySelector('#leaveDate').value;
          const substituteCode = substituteSelect.value;
          const comments = form.querySelector('#leaveComments').value;
          if (!date) {
            showLeaveMessage('Cal indicar la data d\'inici.');
            return;
          }
          if (!substituteCode) {
            showLeaveMessage('Cal seleccionar un substitut.');
            return;
          }
          submitLeaveAction('startLeaveAbsence', row.rowNumber, { date, substituteCode, comments }, 'Registrant baixa...');
        });
        elements.leaveModalActions.append(cancelButton, okButton);
        activateDatepicker(form.querySelector('#leaveDate'));
      }

      function openReturnLeaveModal(row) {
        elements.leaveModalTitle.textContent = "Donar d'alta";
        elements.leaveModalBody.innerHTML = '';
        elements.leaveModalActions.innerHTML = '';
        elements.leaveModalBackdrop.classList.add('open');

        const form = document.createElement('form');
        form.className = 'leave-form-grid';
        form.innerHTML = `
          <p class="mb-0">Confirmes que vols donar d'alta aquest professor?</p>
          <div>
            <label class="form-label" for="returnDate">Data d'alta</label>
            <input id="returnDate" class="form-control" type="text" autocomplete="off">
          </div>
        `;
        elements.leaveModalBody.appendChild(form);

        const cancelButton = createModalButton('Cancel·lar', 'btn btn-outline-secondary', closeLeaveModal);
        const okButton = createModalButton('Ok', 'btn btn-primary', () => {
          const date = form.querySelector('#returnDate').value;
          if (!date) {
            showLeaveMessage('Cal indicar la data d\'alta.');
            return;
          }
          submitLeaveAction('endLeaveAbsence', row.rowNumber, { date }, 'Registrant alta...');
        });
        elements.leaveModalActions.append(cancelButton, okButton);
        activateDatepicker(form.querySelector('#returnDate'));
      }

      function closeLeaveModal() {
        if (state.leaveDatepicker) {
          state.leaveDatepicker.destroy();
          state.leaveDatepicker = null;
        }
        elements.leaveModalBackdrop.classList.remove('open');
        elements.leaveModalBody.innerHTML = '';
        elements.leaveModalActions.innerHTML = '';
      }

      function activateDatepicker(input) {
        if (state.leaveDatepicker) state.leaveDatepicker.destroy();
        state.leaveDatepicker = flatpickr(input, {
          dateFormat: 'Y-m-d',
          defaultDate: new Date(),
          locale: { ...flatpickr.l10ns.es, firstDayOfWeek: 1 },
        });
      }

      function submitLeaveAction(functionName, rowNumber, payload, message) {
        elements.leaveModalActions.querySelectorAll('button').forEach((button) => {
          button.disabled = true;
        });
        showLeaveMessage(message, false);

        google.script.run
          .withSuccessHandler(() => {
            closeLeaveModal();
            loadData();
          })
          .withFailureHandler((error) => {
            showLeaveMessage(getErrorMessage(error), true);
            elements.leaveModalActions.querySelectorAll('button').forEach((button) => {
              button.disabled = false;
            });
          })[functionName](rowNumber, payload);
      }

      function showLeaveMessage(message, isError = true) {
        let messageElement = elements.leaveModalBody.querySelector('.leave-message');
        if (!messageElement) {
          messageElement = document.createElement('div');
          messageElement.className = 'message leave-message';
          elements.leaveModalBody.prepend(messageElement);
        }
        messageElement.textContent = message;
        messageElement.classList.toggle('error', Boolean(isError));
      }

      function createModalButton(text, className, onClick) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = className;
        button.textContent = text;
        button.addEventListener('click', onClick);
        return button;
      }

      function openExportModal() {
        if (state.selectedRows.size === 0) {
          showMessage('Cal seleccionar almenys una fila.', true);
          return;
        }
        elements.exportResult.textContent = '';
        elements.exportResult.classList.remove('error');
        elements.exportModalBackdrop.classList.add('open');
      }

      function closeExportModal() {
        elements.exportModalBackdrop.classList.remove('open');
      }

      function exportSelectedRows() {
        const rowNumbers = [...state.selectedRows];
        elements.confirmExportButton.disabled = true;
        elements.exportResult.textContent = 'Exportant...';
        elements.exportResult.classList.remove('error');

        google.script.run
          .withSuccessHandler((result) => {
            elements.confirmExportButton.disabled = false;
            elements.exportResult.innerHTML = '';
            downloadTextFile(result);
            elements.exportResult.textContent = `Descarregat: ${result.fileName}`;
          })
          .withFailureHandler((error) => {
            elements.confirmExportButton.disabled = false;
            elements.exportResult.textContent = getErrorMessage(error);
            elements.exportResult.classList.add('error');
          })
          .exportTeachers(rowNumbers);
      }

      function downloadTextFile(file) {
        const blob = new Blob([file.content], {
          type: file.mimeType || 'text/csv;charset=utf-8',
        });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = file.fileName;
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
      }

      function compareRows(a, b, key) {
        const resolvedKey = key === 'fullName' ? 'fullNameSort' : key;
        return String(a[resolvedKey] || '').localeCompare(String(b[resolvedKey] || ''), 'ca', {
          numeric: true,
          sensitivity: 'base',
        });
      }

      function normalize(value) {
        return String(value || '').trim().toLocaleLowerCase('ca');
      }

      function setLoading(isLoading, message) {
        state.loading = isLoading;
        updateActionButtonState();
        if (message) showMessage(message, false);
      }

      function showMessage(message, isError) {
        elements.message.textContent = message;
        elements.message.classList.toggle('error', Boolean(isError));
      }

      function getErrorMessage(error) {
        return error && error.message ? error.message : String(error || 'Error desconegut');
      }
    </script>
  </body>
</html>
